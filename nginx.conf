server {
    listen 8080;
    server_name localhost;
    absolute_redirect off;
    server_tokens off;
    client_max_body_size 10m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = / {
        return 302 /zakup/PLAN/;
    }
    location = /zakup/PLAN {
        return 302 /zakup/PLAN/;
    }
    location ^~ /zakup/PLAN/api/ {
        proxy_pass http://app:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /zakup/PLAN/assets/ {
        alias /srv/cehtakt/assets/;
    }
    location = /zakup/PLAN/favicon.svg {
        alias /srv/cehtakt/favicon.svg;
    }
    location = /zakup/PLAN/icons.svg {
        alias /srv/cehtakt/icons.svg;
    }
    location = /zakup/PLAN/selfhost.css {
        alias /srv/cehtakt/selfhost.css;
    }
    location /zakup/PLAN/ {
        alias /srv/cehtakt/;
        try_files $uri /zakup/PLAN/index.html;
    }
    location / {
        return 404;
    }
}
