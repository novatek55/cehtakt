name: cehtakt

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: cehtakt
      MARIADB_USER: cehtakt
      MARIADB_PASSWORD: ${CEHTAKT_DB_PASSWORD:?Run ./install.sh first}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - database:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_NAME: cehtakt
      DB_USER: cehtakt
      DB_PASSWORD: ${CEHTAKT_DB_PASSWORD:?Run ./install.sh first}
      DJANGO_SECRET_KEY: ${CEHTAKT_SECRET_KEY:?Run ./install.sh first}
      DJANGO_SCRIPT_NAME: /zakup/PLAN
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_COOKIES: "0"
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).status == 200"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    depends_on:
      app:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${CEHTAKT_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/srv/cehtakt:ro
    networks: [edge, private]
    restart: unless-stopped

networks:
  edge:
  private:
    internal: true

volumes:
  database:
